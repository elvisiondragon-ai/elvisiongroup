<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | eL Vision Group</title>
    
    <!-- SEO Meta Tags -->
    <meta name="robots" content="noindex, follow">
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://elvisiongroup.com/wp-content/uploads/2026/02/transparent_logo.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            color: white;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* Animated Stardust Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #1a0033 50%, #000000 100%);
            z-index: -1;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .content {
            z-index: 1;
            padding: 20px;
        }

        h1 {
            font-size: 8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #9933cc, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(153, 51, 204, 0.5);
        }

        p.oops {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ddd;
        }

        p.message {
            font-size: 1.2rem;
            color: #bbb;
            margin-bottom: 40px;
        }

        .cta-btn {
            background: linear-gradient(135deg, #663366, #9933cc);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.4s;
            box-shadow: 0 10px 40px rgba(153, 51, 204, 0.4);
            text-decoration: none;
            display: inline-block;
        }

        .cta-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, #774477, #aa44dd);
            border-color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 5rem;
            }
            p.oops {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="stars" id="stars"></div>
    </div>

    <div class="content">
        <h1>404</h1>
        <p class="oops" data-en="Anda Salah Pages Loh !" data-id="Anda Salah Halaman Loh !">Anda Salah Pages Loh !</p>
        <p class="message" data-en="The page you are looking for does not exist in this reality." data-id="Halaman yang Anda cari tidak ada dalam realitas ini.">The page you are looking for does not exist in this reality.</p>
        <a href="https://elvisiongroup.com" class="cta-btn" data-en="Back to Home" data-id="Kembali ke Beranda">Back to Home</a>
    </div>

    <script>
        // Create animated stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                
                starsContainer.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            
            // Sync with parent site language if possible (defaults to ID if previous session was ID)
            const savedLang = localStorage.getItem('language') || 'en';
            if (savedLang === 'id') {
                document.querySelectorAll('[data-en]').forEach(element => {
                    element.textContent = element.getAttribute('data-id');
                });
            }
        });
    </script>
</body>
</html>
