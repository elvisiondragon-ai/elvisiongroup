| column_name       | data_type                | is_nullable | column_default    |
| ----------------- | ------------------------ | ----------- | ----------------- |
| id                | uuid                     | NO          | gen_random_uuid() |
| user_id           | uuid                     | NO          | null              |
| user_name         | text                     | NO          | null              |
| user_level        | integer                  | NO          | 1                 |
| is_pro            | boolean                  | YES         | false             |
| message           | text                     | NO          | null              |
| created_at        | timestamp with time zone | NO          | now()             |
| channel_id        | text                     | YES         | 'community'::text |
| is_private        | boolean                  | YES         | false             |
| allowed_users     | ARRAY                    | YES         | null              |
| subscription_type | text                     | YES         | null              |
| is_admin          | boolean                  | YES         | false             |

| indexname                      | indexdef                                                                                                   |
| ------------------------------ | ---------------------------------------------------------------------------------------------------------- |
| chat_messages_pkey             | CREATE UNIQUE INDEX chat_messages_pkey ON public.chat_messages USING btree (id)                            |
| idx_chat_messages_channel_id   | CREATE INDEX idx_chat_messages_channel_id ON public.chat_messages USING btree (channel_id)                 |
| idx_chat_messages_created_at   | CREATE INDEX idx_chat_messages_created_at ON public.chat_messages USING btree (created_at DESC)            |
| idx_chat_messages_privacy      | CREATE INDEX idx_chat_messages_privacy ON public.chat_messages USING btree (channel_id, is_private)        |
| idx_chat_messages_user_id      | CREATE INDEX idx_chat_messages_user_id ON public.chat_messages USING btree (user_id)                       |
| idx_chat_messages_user_created | CREATE INDEX idx_chat_messages_user_created ON public.chat_messages USING btree (user_id, created_at DESC) |

-- Check RLS policies
  SELECT
      policyname,
      permissive,
      roles,
      cmd,
      qual,
      with_check
  FROM pg_policies
  WHERE tablename = 'chat_messages'
      AND schemaname = 'public';

