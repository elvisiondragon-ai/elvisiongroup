name_generation_patterns:
  pattern_1:
    name: "Full Name (First Last)"
    description: "Complete name with first and last name, proper capitalization"
    examples: 
      - "Sari Kusuma"
      - "Ahmad Santoso"
      - "Dewi Anggraini"
    format: "FirstName LastName"

  pattern_2:
    name: "Single Name"
    description: "Single name only, proper capitalization"
    examples:
      - "Gustian"
      - "Agustinus"
    format: "Name"

  pattern_3:
    name: "All Small First Name"
    description: "Single first name, all lowercase"
    examples:
      - "aisyah"
      - "sinta"
      - "fajar"
    format: "firstname"

  pattern_4:
    name: "All Small First Last Name"
    description: "First and last name, all lowercase"
    examples:
      - "budiartanto"
      - "rahmadhani"
      - "lisaanggraeni"
    format: "firstlastname"

  pattern_5:
    name: "First Name Random All Small"
    description: "Random first name combination, all lowercase"
    examples:
      - "ratnapermata"
      - "andihartawan"
      - "rizkianugerah"
    format: "randomfirstname"

  pattern_6:
    name: "First Last Name Random All Small"
    description: "Random first and last name combination, all lowercase"
    examples:
      - "budiciamissol"
      - "dewiputri"
      - "arifinugroho"
    format: "randomfirstlastname"

  pattern_7:
    name: "Capital First Name + Job Level"
    description: "Proper capitalized name with professional title"
    examples:
      - "Dr. Hendro Wijaya"
      - "Ir. Irwandi"
      - "Prof. Nugroho"
    format: "Title. FirstName LastName"

  pattern_8:
    name: "Single Name Intellectual"
    description: "Single name with intellectual/professional title"
    examples:
      - "Prof. Joko"
      - "Dr. Maya"
      - "Ir. Bambang"
    format: "Title. Name"

  pattern_9:
    name: "Full Name Intellectual"
    description: "Complete name with intellectual/professional title"
    examples:
      - "drg. Susi Ramdani"
      - "Prof. Wahyu Hidayat"
      - "Dr. Indira Sari"
    format: "title. FirstName LastName"

  pattern_10:
    name: "All Small Name Intellectual"
    description: "Intellectual title with lowercase name"
    examples:
      - "dr. hendri"
      - "prof. bayu"
      - "ir. imam"
    format: "title. name"

