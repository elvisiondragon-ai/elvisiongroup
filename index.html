    <style>
      /* Initial loading styles to prevent white flash */
      body {
        margin: 0;
        padding: 0;
        background: #0A0A0F;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        -ms-text-size-adjust: none;
        text-size-adjust: none;
      }

      #root {
        min-height: 100vh;
        background: #0A0A0F;
      }
      
      /* Loading spinner for initial load */
      .initial-loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      
      .initial-loader img {
        width: 150px;
        height: 150px;
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
    
    <script>
      // SIMPLE RECOVERY SERVICE WORKER - NO RACE CONDITIONS
      
      // Immediate black screen detection and recovery
      let isBlackScreen = false;
      const checkForBlackScreen = () => {
        const root = document.getElementById('root');
        if (!root || !root.children.length) {
          isBlackScreen = true;
          console.log('🚑 BLACK SCREEN DETECTED - Starting recovery');
          return true;
        }
        return false;
      };
      
      // Recovery checker - only starts when SW update is needed
      let blackScreenChecker = null;
      
      // Function to start recovery monitoring (called when onNeedRefresh triggers)
      window.startUpdateRecovery = function() {
        if (blackScreenChecker) return; // Already monitoring
        
        console.log('🛡️ Starting update recovery monitoring...');
        blackScreenChecker = setInterval(() => {
          if (checkForBlackScreen()) {
            console.log('🚑 Auto-recovery: Black screen detected during SW update');
            window.recoveryMode();
            clearInterval(blackScreenChecker);
            blackScreenChecker = null;
          }
        }, 3000);
        
        // Stop monitoring after 30 seconds (enough time for update process)
        setTimeout(() => {
          if (blackScreenChecker) {
            clearInterval(blackScreenChecker);
            blackScreenChecker = null;
            console.log('✅ Update recovery monitoring stopped - update completed');
          }
        }, 30000);
      };
      
      // Recovery function
      window.recoveryMode = function() {
        console.log('🚑 RECOVERY MODE ACTIVATED');
        localStorage.clear();
        sessionStorage.clear();
        if (window.indexedDB) {
          indexedDB.deleteDatabase('supabase-auth-token');
        }
        
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
            window.location.href = window.location.origin;
          });
        } else {
          window.location.href = window.location.origin;
        }
      };
      
      // Clean up recovery URL parameter
      if (window.location.search.includes('recovery_manual')) {
        console.log('🧹 Cleaning up recovery URL');
        window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
      }
      
      // Service worker registration for development (production uses Vite PWA auto-registration)
      if ('serviceWorker' in navigator && location.hostname === 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { 
            updateViaCache: 'none'
          })
          .then((registration) => {
            console.log('✅ Development SW registered:', registration);
            registration.update();
          })
          .catch((error) => {
            console.log('❌ SW registration failed:', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Initial loading indicator -->
      <div class="initial-loader">
        <img src="/favicon.png" alt="Loading..." />
        <div style="margin-top: 20px; font-size: 18px; background: linear-gradient(to right, #fb923c, #facc15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 600; text-shadow: 0 0 15px rgba(251, 146, 60, 0.4);">Initiate The App 🚀</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
