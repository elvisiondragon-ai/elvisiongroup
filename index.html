    <script>
      // SIMPLE RECOVERY SERVICE WORKER - NO RACE CONDITIONS
      
      // Immediate black screen detection and recovery
      let isBlackScreen = false;
      const checkForBlackScreen = () => {
        const root = document.getElementById('root');
        if (!root || !root.children.length) {
          isBlackScreen = true;
          console.log('🚑 BLACK SCREEN DETECTED - Starting recovery');
          return true;
        }
        return false;
      };
      
      // Check for black screen every 2 seconds
      const blackScreenChecker = setInterval(() => {
        if (checkForBlackScreen()) {
          console.log('🚑 Auto-recovery: Black screen detected');
          window.recoveryMode();
          clearInterval(blackScreenChecker);
        }
      }, 2000);
      
      // Stop checking after 10 seconds if app loads
      setTimeout(() => {
        if (!isBlackScreen) {
          clearInterval(blackScreenChecker);
        }
      }, 10000);
      
      // Recovery function
      window.recoveryMode = function() {
        console.log('🚑 RECOVERY MODE ACTIVATED');
        localStorage.clear();
        sessionStorage.clear();
        if (window.indexedDB) {
          indexedDB.deleteDatabase('supabase-auth-token');
        }
        
        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
            window.location.href = window.location.origin + '?recovery_manual=' + Date.now();
          });
        } else {
          window.location.href = window.location.origin + '?recovery_manual=' + Date.now();
        }
      };
      
      // Service worker registration for development (production uses Vite PWA auto-registration)
      if ('serviceWorker' in navigator && location.hostname === 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { 
            updateViaCache: 'none'
          })
          .then((registration) => {
            console.log('✅ Development SW registered:', registration);
            registration.update();
          })
          .catch((error) => {
            console.log('❌ SW registration failed:', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
