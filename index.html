    <script>
      // 🎵 Register BACKGROUND AUDIO ONLY service worker (NO caching)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // First clear any existing caches
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map(name => caches.delete(name)));
            }
            
            // Register background audio service worker
            const registration = await navigator.serviceWorker.register('/sw.js');
            console.log('🎵 Background audio SW registered:', registration.scope);
          } catch (error) {
            console.log('🎵 Background audio SW registration failed:', error);
          }
        });
      }
    </script>
