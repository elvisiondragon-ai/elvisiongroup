<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS-specific meta tags for better compatibility -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Android-specific optimizations -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>eL Vision Group</title>
    <meta name="description" content="eL Vision Group Ecosystem" />
    <meta name="author" content="eL Vision Group" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:title" content="eL Vision Group" />
    <meta property="og:description" content="eL Vision Group Ecosystem" />
    <meta property="og:type" content="website" />


    
    <style>
      /* Initial loading styles to prevent white flash */
      body {
        margin: 0;
        padding: 0;
        background: #0A0A0F;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        -ms-text-size-adjust: none;
        text-size-adjust: none;
      }

      #root {
        min-height: 100vh;
        background: #0A0A0F;
      }
      
      /* Loading spinner for initial load */
      .initial-loader {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      
      .initial-loader img {
        width: 150px;
        height: 150px;
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
    
    <script>
      // 🚀 iOS SAFARI FOOLPROOF CACHE BUSTER (Hardcoded Version 1.0.4)
      (function() {
        var APP_VERSION = '1.0.5';
        try {
          var url = new URL(window.location.href);
          var v = url.searchParams.get('v');
          var lastV = localStorage.getItem('app_version_tag');

          // 1. Force Redirect ONLY if we don't have the param AND the stored version is old
          if (v !== APP_VERSION && lastV !== APP_VERSION) {
            url.searchParams.set('v', APP_VERSION);
            window.location.replace(url.toString());
          } 
          // 2. If we ARE on the new version, save it to stop future redirects and clean the URL
          else if (v === APP_VERSION) {
            localStorage.setItem('app_version_tag', APP_VERSION);
            setTimeout(function() {
              var cleanUrl = window.location.origin + window.location.pathname + window.location.hash;
              window.history.replaceState({}, document.title, cleanUrl);
            }, 1500);
          }
        } catch (e) {
          console.error('Cache buster error:', e);
        }
      })();
    </script>
    
    <script>
      // Service worker registration for development (production uses Vite PWA auto-registration)
      if ('serviceWorker' in navigator && location.hostname === 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { 
            updateViaCache: 'none'
          })
          .then((registration) => {
            console.log('✅ Development SW registered:', registration);
            registration.update();
          })
          .catch((error) => {
            console.log('❌ SW registration failed:', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <div id="root">
      <!-- Initial loading indicator -->
      <div class="initial-loader">
        <img src="/favicon.png" alt="Loading..." />
        <div style="margin-top: 20px; font-size: 18px; background: linear-gradient(to right, #fb923c, #facc15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 600; text-shadow: 0 0 15px rgba(251, 146, 60, 0.4);">🚀 Initiate Ecosystem..</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
